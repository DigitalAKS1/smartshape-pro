# Live copy: /etc/nginx/conf.d/smartshape-gzip.conf on the VPS (added 2026-11-13).
# Host nginx proxies the frontend over HTTP/1.0, which disabled the container's gzip,
# so the 478 KB JS bundle went out uncompressed. Compressing at the host fixes it
# (bundle ~145 KB, API JSON ~80% smaller). `gzip on;` itself stays in nginx.conf.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;
