# SmartShape Pro - nginx config
# HTTP: Let's Encrypt challenge pass-through, then redirect to HTTPS
server {
    if ($host = app.smartshape.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.smartshape.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }


}

# HTTPS - Certbot will replace ssl_certificate lines
server {
    listen 443 ssl;
    server_name app.smartshape.in;
    ssl_certificate /etc/letsencrypt/live/app.smartshape.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.smartshape.in/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    # WebSocket
    location /api/ws/ {
        proxy_pass          http://localhost:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
    }

    # WhatsApp inbox live stream (Server-Sent Events): never buffer, long read timeout
    location = /api/wa/stream {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # WhatsApp media (attachments we send, inbound media we store) served by the backend static mount.
    # Without this the frontend SPA fallback answers with index.html (found 2026-09-27).
    location /uploads/whatsapp/ {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Certificate PDFs served by the backend static mount (for WhatsApp/email links)
    location /uploads/certificates/ {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Frontend (React)
    location / {
        proxy_pass         http://localhost:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

}
