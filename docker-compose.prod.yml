# Production compose — MongoDB on Atlas (cloud), Redis local
# Database on Atlas, cache on local Redis, uploads persisted

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartshape-backend
    env_file: ./backend/.env
    environment:
      - PORT=8000
      # cache.py reads REDIS_HOST (default "localhost", which inside the container
      # is the container itself, not the redis service) — every cache write was
      # failing with "Cache set error: ... localhost:6379" and falling back.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://app.smartshape.in}
    container_name: smartshape-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartshape-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_LOGLEVEL=notice

volumes:
  backend_uploads:
  redis_data:
